spring:
  config:
    import: optional:file:../.env[.properties]

  application:
    name: hack4hack-api

  datasource:
    url: jdbc:postgresql://localhost:5434/hack4hack
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD}
    driver-class-name: org.postgresql.Driver

  flyway:
    enabled: true

server:
  port: 8080